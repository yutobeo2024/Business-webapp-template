name: CI/CD

# PR: kiểm tra chất lượng. Push main: kiểm tra + build image + deploy STAGING.
# Push tag vX.Y.Z: kiểm tra + build image + deploy PRODUCTION (cần người duyệt trong environment "production").
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.24.2
  TRIVY_VERSION: 0.62.1

jobs:
  quality:
    name: Lint, typecheck, unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tự kiểm hook Claude Code
        run: pnpm claude:selftest
      - name: Shellcheck script vận hành
        run: shellcheck -x infra/*.sh tests/infra/*.sh
      - name: Script vận hành có quyền chạy (+x)
        run: |
          bad=$(git ls-files -s infra/*.sh | grep -v '^100755' || true)
          if [ -n "$bad" ]; then
            echo "::error::Thiếu bit +x. Sửa: git update-index --chmod=+x <file> rồi commit."
            echo "$bad"
            exit 1
          fi
      - name: Kiểm hành vi script vận hành (docker giả, không đụng máy chủ)
        run: bash tests/infra/run.sh
      - name: Migration không phá tương thích với bản đang chạy (rollback chỉ quay image)
        run: node --test scripts/check-migrations.test.mjs scripts/remove-sample.test.mjs scripts/project-setup.test.mjs && node scripts/check-migrations.mjs
      - name: Migration khớp schema (phát hiện quên pnpm db:generate)
        run: |
          pnpm --filter @app/db exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::schema.ts đã đổi nhưng chưa sinh migration. Chạy: pnpm db:generate --name <ten> và commit."
            git status --porcelain packages/db/migrations
            exit 1
          fi

  integration:
    name: Test tích hợp (PostgreSQL + Redis thật)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      # SMTP giả cho test gửi email (worker); API đọc thư ở cổng 8025.
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379/15
      TEST_SMTP_URL: smtp://localhost:1025
      TEST_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Chromium cho test tích hợp worker (in PDF)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
      - name: Khôi phục DB thật (bảng sinh sau bản sao lưu phải mất, file hỏng không đụng DB)
        run: bash tests/infra/restore-real.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://app:app@localhost:5432/app_e2e
      REDIS_URL: redis://localhost:6379/14
      APP_ORIGIN: http://localhost:4173
      TRUST_PROXY_HOPS: "1"
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: e2e-mat-khau-chi-dung-trong-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:seed -- --demo
      - name: Khởi động API và web preview
        run: |
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm exec vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4173/api/health && exit 0
            sleep 2
          done
          cat /tmp/api.log /tmp/web.log
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: Quét bảo mật
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Quét secret lọt vào lịch sử git (gitleaks)
        run: docker run --rm -v "$PWD:/repo" "zricethezav/gitleaks:${GITLEAKS_VERSION}" detect --source /repo --redact --no-banner
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Lỗ hổng trong dependency production
        run: pnpm audit --prod --audit-level high
      - name: Quét lỗ hổng và cấu hình sai (trivy)
        run: >-
          docker run --rm -v "$PWD:/src" "aquasec/trivy:${TRIVY_VERSION}"
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  images:
    name: Build image ${{ matrix.app }}
    if: github.event_name == 'push'
    needs: [quality, integration, e2e, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, web]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Tag phát hành phải trỏ vào commit đã có trên main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME trỏ vào commit chưa được merge vào main (chưa qua review). Không build, không deploy."
            exit 1
          fi
      - id: tag
        name: Xác định tag image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - id: image
        name: Tên image (chữ thường)
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image worker để kiểm trước khi đẩy
        if: matrix.app == 'worker'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          load: true
          tags: worker-smoke:local
          cache-from: type=gha,scope=worker
      - name: Chromium và font tiếng Việt trong image worker in được PDF
        if: matrix.app == 'worker'
        run: bash tests/infra/worker-pdf-smoke.sh worker-smoke:local
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          provenance: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'main' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: images
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: ${{ needs.images.outputs.tag }}
    secrets: inherit

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      tag: ${{ needs.images.outputs.tag }}
    secrets: inherit

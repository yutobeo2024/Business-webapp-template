name: Bảo trì định kỳ

# Hằng tuần: quét lỗ hổng mới công bố trên dependency và image đang chạy production.
# Có lỗi thì mở issue để không bị bỏ sót.
on:
  schedule:
    - cron: "0 1 * * 1" # 08:00 thứ Hai giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

env:
  TRIVY_VERSION: 0.62.1

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Lỗ hổng dependency production
        id: audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Quét image bản release đang chạy
        id: images
        continue-on-error: true
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          status=0
          for app in api worker web; do
            # Pull bằng docker của runner (đã login). Container trivy không có thông tin đăng nhập registry:
            # để nó tự kéo image private thì lỗi và mỗi tuần mở một issue "lỗ hổng" không có thật.
            if ! docker pull --quiet "$prefix/$app:release"; then
              echo "::warning::Không pull được $app:release (chưa phát hành lần nào?). Bỏ qua quét image này."
              continue
            fi
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy:${TRIVY_VERSION}" \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$prefix/$app:release" || status=1
          done
          exit "$status"
      - name: Mở issue khi phát hiện vấn đề
        if: steps.audit.outcome == 'failure' || steps.images.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Bảo trì: phát hiện lỗ hổng mức HIGH/CRITICAL ($(date +%F))" \
            --body "Lần quét định kỳ phát hiện lỗ hổng. Chi tiết: $RUN_URL. Xử lý bằng skill /upgrade-deps trong Claude Code."

name: Rollback

# Chạy tay: Actions > Rollback > Run workflow. Chọn môi trường và nhập tag đã từng chạy ổn
# (xem /opt/app/infra/deploy-history.log hoặc tab Packages). Không chạy migration.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: Tag image muốn quay về, ví dụ v1.4.2 hoặc sha-1a2b3c4
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Báo lỗi rõ thay vì "skipped" lặng lẽ: lúc có sự cố người vận hành dễ tưởng đã rollback xong.
  require-main:
    name: Chỉ chạy Rollback từ nhánh main
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Rollback phải chạy từ nhánh main (đang chạy từ $GITHUB_REF). Chọn 'Use workflow from: main'."
          exit 1

  rollback:
    # Chỉ chạy từ main: deploy.yml rsync thư mục infra/ của nhánh được chọn lên máy chủ.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      tag: ${{ inputs.tag }}
      skip_migrate: true
    secrets: inherit

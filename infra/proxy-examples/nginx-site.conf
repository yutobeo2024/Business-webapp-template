# Máy dùng chung có nginx giữ 80/443: site chuyển tiếp tới Caddy của app trên loopback.
#   cp nginx-site.conf /etc/nginx/sites-available/<app>.conf && ln -s ../sites-available/<app>.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d app.tencongty.vn       (cấp HTTPS)
#   nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name app.tencongty.vn;

    # Lớn hơn FILE_MAX_MB một chút, như Caddy của app.
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Caddy của app tin X-Forwarded-For từ mạng riêng; API cần TRUST_PROXY_HOPS=2 để thấy IP thật.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
